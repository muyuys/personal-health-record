<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="个人健康档案：健康主题、检验趋势、检查时间线、用药与复诊待办。数据保存在本机浏览器。">
<title>个人健康档案</title>
<meta name="theme-color" content="#173F33">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23173F33'/%3E%3Cpath d='M7 18h4l2.6-6.5 3 11.5 2.6-5H25' fill='none' stroke='%23EDE7DA' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/styles.css?v=20261031e">
</head>
<body>
<div class="app">
  <aside class="rail">
    <a class="brand" href="#/overview" aria-label="返回总览">
      <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="#173F33"/>
        <path d="M7 18h4l2.6-6.5 3 11.5 2.6-5H25" stroke="#EDE7DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-t"><b>健康档案</b><span>PERSONAL RECORD</span></span>
    </a>

    <p class="rail-label">档案目录</p>
    <nav class="nav" id="nav" aria-label="档案目录"></nav>

    <div class="rail-space"></div>

    <div class="storage">
      <div class="storage-row"><span class="dot" id="storeDot"></span><b id="storeLabel">数据仅存本机</b></div>
      <p id="storeHint">清空浏览器数据会丢失记录，建议每月导出一次备份。</p>
      <button class="storage-btn" data-act="export">导出备份</button>
      <div class="storage-links">
        <button data-act="go" data-to="profile">个人资料</button>
        <button data-act="import">导入数据</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="page-head">
      <div class="page-head-l">
        <p class="eyebrow" id="pageEyebrow"></p>
        <h1 id="pageTitle"></h1>
        <p class="page-sub" id="pageSub"></p>
      </div>
      <div class="page-actions" id="pageActions"></div>
    </header>

    <div class="view" id="view"></div>

    <p class="disclaimer">
      数据用于个人整理，参考范围与异常提示不能替代医生解读。空白代表未记录，不等于没有症状或数值为 0；
      历史用药不自动视为当前用药。文件夹名称与未验证推测不作为确诊依据。
    </p>
  </main>
</div>

<nav class="tabbar" id="tabbar" aria-label="底部导航"></nav>

<div class="modal-root" id="modalRoot" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<noscript>
  <p style="padding:24px">此页需要 JavaScript 才能显示档案内容；也可以在 docs/ 下直接打开对应的说明页。</p>
</noscript>

<script src="assets/data.js?v=20261101c"></script>
<script src="assets/parse.js?v=20261031d"></script>
<!-- task 019：app.js 按视图拆分为多个模块，按依赖顺序加载（全部为经典脚本，共享全局作用域） -->
<script src="js/app.domain.js?v=20261101b"></script>
<script src="js/app.storage.js?v=20261101b"></script>
<script src="js/app.core.js?v=20261101c"></script>
<script src="js/app.derive.js?v=20261101c"></script>
<script src="js/app.views.health.js?v=20261101c"></script>
<script src="js/app.views.body.js?v=20261101c"></script>
<script src="js/app.views.profile.js?v=20261101a"></script>
<script src="js/app.modal.js?v=20261101c"></script>
<script src="js/app.boot.js?v=20261101c"></script>
</body>
</html>
