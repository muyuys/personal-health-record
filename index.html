<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="个人健康档案：就医记录、日常健康、健康主题与检验趋势。数据保存在本机，随时可以补。">
<title>健康档案</title>
<meta name="theme-color" content="#173F33">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23173F33'/%3E%3Cpath d='M7 18h4l2.6-6.5 3 11.5 2.6-5H25' fill='none' stroke='%23EDE7DA' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/styles.css?v=20261105b">
<link rel="stylesheet" href="assets/ui-refinement.css?v=20261107d">
<link rel="stylesheet" href="assets/features.css?v=20261108b">
<link rel="stylesheet" href="assets/metrics.css?v=20261107b">
<link rel="stylesheet" href="assets/settings.css?v=20261107c">
<link rel="stylesheet" href="assets/profile-menu.css?v=20261107a">
</head>
<body>
<div class="app">
  <aside class="rail is-collapsed">
    <div class="rail-header">
    <a class="brand" href="#/home" aria-label="回到首页">
      <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="#173F33"/>
        <path d="M7 18h4l2.6-6.5 3 11.5 2.6-5H25" stroke="#EDE7DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-t"><b>健康档案</b><span>我的个人健康记录</span></span>
    </a>
    <button class="rail-toggle" id="railToggle" type="button" aria-label="展开侧边栏" title="展开侧边栏" aria-expanded="false" aria-controls="nav">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/><path class="toggle-chevron" d="m14 9 3 3-3 3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>展开菜单</span>
    </button>
    </div>

    <nav class="nav" id="nav" aria-label="主导航"></nav>

    <button class="store-line" data-act="go" data-to="me" data-scroll="storage" aria-label="查看存储与帮助">
      <svg class="store-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/></svg>
      <span class="dot" id="storeDot"></span>
      <b id="storeLabel">数据已存本机</b>
      <span class="store-more">详情</span>
    </button>
  </aside>

  <main class="main">
    <header class="page-head">
      <div class="page-head-l">
        <p class="eyebrow" id="pageEyebrow"></p>
        <h1 id="pageTitle"></h1>
        <p class="page-sub" id="pageSub"></p>
      </div>
      <div class="page-actions" id="pageActions"></div>
    </header>

    <!-- 日常健康外层四段切换（027 §6.1）。挂在页头下方而不是 #view 里：
         各段重渲染（保存/删除后直接调 renderWeight 等）不会把切换条冲掉 -->
    <div class="daily-nav" id="dailySeg" hidden></div>

    <div class="view" id="view"></div>

    <p class="disclaimer">
      数据用于个人整理，参考范围与异常提示不能替代医生解读。空白代表未记录，不等于没有症状或数值为 0。
      历史用药不自动视为当前用药。文件夹名称与未验证推测不作为确诊依据。
    </p>
  </main>
</div>

<nav class="tabbar" id="tabbar" aria-label="底部导航"></nav>
<div id="profileMenu" class="profile-menu" role="dialog" aria-label="我的与健康档案" hidden></div>

<div class="modal-root" id="modalRoot" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<noscript>
  <p style="padding:24px">此页需要 JavaScript 才能显示档案内容；也可以直接在 docs/ 下打开对应的说明页。</p>
</noscript>

<script src="assets/data.js?v=20261031d"></script>

<script src="assets/vendor/echarts.min.js?v=20261101b"></script>
<script src="assets/metrics.js?v=20261107a"></script>
<!-- 回答内容的 Markdown 渲染（离线、无第三方依赖） -->
<script src="assets/markdown.js?v=20261107a"></script>
<script src="js/app.chart.js?v=20261107a"></script>
<!-- task 019：app.js 按视图拆分为多个模块，按依赖顺序加载（全部为经典脚本，共享全局作用域） -->

<script src="js/app.views.health.js?v=20261107e"></script>
<!-- task 026/027：首页 / 就医记录 / 就诊详情 / 速记页 / 存报告页 -->
<script src="js/app.views.records.js?v=20261107a"></script>
<script src="js/app.views.body.js?v=20261105c"></script>
<script src="js/app.views.profile.js?v=20261107b"></script>
<script src="js/app.modal.js?v=20261107b"></script>
<script src="js/app.views.metrics.js?v=20261107b"></script>
<script src="js/app.features.js?v=20261108b"></script>
<script src="js/app.profile-menu.js?v=20261107a"></script>
<script src="js/app.boot.js?v=20261107f"></script>
</body>
</html>
